<!DOCTYPE html>
<html>
<head>
  <title>Just one question...</title>
  <style>
    body {
      text-align: center;
      font-family: Arial, sans-serif;
      background: linear-gradient(to bottom, #ffe6f0, #ffd6eb);
      overflow: hidden;
      margin: 0;
    }

    h1 {
      color: #ff3385;
      margin-top: 100px;
      font-size: 4.5em;
    }

    button {
      padding: 12px 25px;
      margin: 15px;
      font-size: 18px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: 0.2s;
      align: center;
    }

    #yesBtn {
      background-color: #4CAF50;
      color: white;
    }

    #yesBtn:hover {
      transform: scale(1.1);
    }

    #noBtn {
      background-color: #ff4d4d;
      color: white;
      position: absolute;
    }

    /* floating hearts */
    .heart {
      position: absolute;
      font-size: 20px;
      animation: floatUp 5s linear infinite;
    }

    @keyframes floatUp {
      0% {
        transform: translateY(100vh);
        opacity: 1;
      }
      100% {
        transform: translateY(-10vh);
        opacity: 0;
      }
    }

    /* NEW floating images */
    .float-img {
      position: absolute;
      width: 400px;
      border-radius: 10px; /* 👈 rounded */
      animation: floatImg 8s linear forwards; /* 👈 slower */
    }

    @keyframes floatImg {
      0% {
        transform: translateY(100vh);
        opacity: 1;
      }
      100% {
        transform: translateY(-10vh);
        opacity: 0;
      }
    }
  </style>
</head>
<body>

  <h1 id="question">Do you forgive me? 💔</h1>

  <button id="yesBtn">Yes 💖</button>
  <button id="noBtn">No 😢</button>

  <script>
    const question = document.getElementById("question");
    const noBtn = document.getElementById("noBtn");
    const yesBtn = document.getElementById("yesBtn");

    let stage = 0;

    yesBtn.onclick = function() {
      question.innerText = "I love you bbe ❤️🥺";
      noBtn.style.display = "none";
      yesBtn.style.display = "none";

      createHearts(25);
      createImages(6);
    };

    noBtn.onclick = function() {
      if (stage === 0) {
        question.innerText = "Are you sure? 😢";
        stage = 1;
      } else {
        const x = Math.random() * (window.innerWidth - 100);
        const y = Math.random() * (window.innerHeight - 50);
        noBtn.style.left = x + "px";
        noBtn.style.top = y + "px";

        let size = parseInt(window.getComputedStyle(yesBtn).fontSize);
        yesBtn.style.fontSize = (size + 2) + "px";
      }
    };

    function createHearts(count) {
      for (let i = 0; i < count; i++) {
        let heart = document.createElement("div");
        heart.className = "heart";
        heart.innerHTML = "💖";
        heart.style.left = Math.random() * 100 + "vw";
        heart.style.animationDuration = (3 + Math.random() * 2) + "s";
        document.body.appendChild(heart);

        setTimeout(() => heart.remove(), 5000);
      }
    }

  </script>

</body>
</html>
